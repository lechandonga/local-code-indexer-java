# 随机端口便于测试；单机使用时不对外暴露
server.port=0
server.address=127.0.0.1

# 本地代码索引器配置（详见 docs/indexer.md）
local-indexer.root-path=.
local-indexer.max-file-size-bytes=5242880
local-indexer.snippet-context-chars=40
local-indexer.max-results=200
# 为空表示不按扩展名过滤；可配置例如 java,xml,properties,yml
local-indexer.include-extensions=
# 并发刷新冲突策略：reject 拒绝后来者，join 复用进行中的任务
local-indexer.refresh-conflict-policy=reject
