server.port=0
# 本地代码索引服务配置（详见 docs/code-indexer.md）
# 要索引的本地代码目录，填绝对路径；留空时不自动建索引，刷新接口返回 ROOT_NOT_CONFIGURED
code-indexer.root=
code-indexer.auto-refresh-on-startup=true
code-indexer.max-file-bytes=1048576
code-indexer.binary-probe-bytes=8192
code-indexer.fragment-window-chars=60
code-indexer.default-limit=200
code-indexer.max-limit=1000
code-indexer.exclude-dir-names=.git,target,build,node_modules,.idea,.gradle
